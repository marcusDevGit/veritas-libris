name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, Tests & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build & Test @app/shared
        run: npm test --workspace=@app/shared

      - name: Test @app/api
        run: npm test --workspace=@app/api

      - name: Typecheck @app/api
        run: npm run typecheck --workspace=@app/api

      - name: Typecheck @app/web
        run: npm run typecheck --workspace=@app/web

      - name: Test @app/web
        run: npm test --workspace=@app/web

      - name: Build @app/web
        run: npm run build --workspace=@app/web

  e2e:
    name: E2E (Playwright Desktop & Mobile)
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build @app/shared
        run: npm run build --workspace=@app/shared

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npm run test:e2e --workspace=@app/web
